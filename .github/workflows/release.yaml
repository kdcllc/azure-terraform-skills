name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate pack
        run: bash scripts/check-skill-pack.sh

      - name: Assert tag matches metadata.version
        run: |
          ver="${GITHUB_REF_NAME#v}"
          grep -qE "^[[:space:]]+version: \"${ver//./\\.}\"" skills/terraform-azure/SKILL.md \
            || { echo "tag ${GITHUB_REF_NAME} does not match metadata.version" >&2; exit 1; }

      - name: Extract changelog section
        run: |
          awk -v ver="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" ver "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
